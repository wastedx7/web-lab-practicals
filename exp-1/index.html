<!-- ========================================================================= -->
<!-- Experiment: HTML Form Validation using Bootstrap 5 and JavaScript Regex  -->
<!-- ========================================================================= -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5 mb-5">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="card shadow">
          <div class="card-header bg-primary text-white text-center">
            <h3>Registration Form</h3>
          </div>
          <div class="card-body">
            <form id="registrationForm">
              <!-- Name -->
              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="Enter your full name">
                <div id="nameError" class="text-danger"></div>
              </div>

              <!-- Username -->
              <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username">
                <div id="usernameError" class="text-danger"></div>
              </div>

              <!-- Email -->
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" id="email" class="form-control" placeholder="Enter email">
                <div id="emailError" class="text-danger"></div>
              </div>

              <!-- Mobile -->
              <div class="mb-3">
                <label class="form-label">Mobile Number</label>
                <input type="text" id="mobile" class="form-control" placeholder="Enter 10-digit mobile number">
                <div id="mobileError" class="text-danger"></div>
              </div>

              <!-- Password -->
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password">
                <div id="passwordError" class="text-danger"></div>
              </div>

              <!-- Confirm Password -->
              <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password">
                <div id="confirmPasswordError" class="text-danger"></div>
              </div>

              <!-- Gender -->
              <div class="mb-3">
                <label class="form-label">Gender</label>
                <div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" value="Male">
                    <label class="form-check-label">Male</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" value="Female">
                    <label class="form-check-label">Female</label>
                  </div>
                </div>
                <div id="genderError" class="text-danger"></div>
              </div>

              <!-- Submit & Reset -->
              <div class="text-center">
                <button type="submit" class="btn btn-primary px-5">Register</button>
                <button type="reset" class="btn btn-secondary px-5">Reset</button>
              </div>
            </form>

            <!-- Success Message -->
            <div id="successMessage" class="alert alert-success mt-4" style="display:none;">
              Registration Successful!
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    document.getElementById("registrationForm").addEventListener("submit", function(event) {
      // Prevent form submission
      event.preventDefault();

      // Get input values
      let name = document.getElementById("name").value.trim();
      let username = document.getElementById("username").value.trim();
      let email = document.getElementById("email").value.trim();
      let mobile = document.getElementById("mobile").value.trim();
      let password = document.getElementById("password").value;
      let confirmPassword = document.getElementById("confirmPassword").value;

      // Clear previous error messages
      document.getElementById("nameError").innerHTML = "";
      document.getElementById("usernameError").innerHTML = "";
      document.getElementById("emailError").innerHTML = "";
      document.getElementById("mobileError").innerHTML = "";
      document.getElementById("passwordError").innerHTML = "";
      document.getElementById("confirmPasswordError").innerHTML = "";
      document.getElementById("genderError").innerHTML = "";
      document.getElementById("successMessage").style.display = "none";

      // Regular Expressions
      let nameRegex = /^[A-Za-z ]{3,50}$/;
      let usernameRegex = /^[A-Za-z0-9_]{3,20}$/;
      let emailRegex = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
      let mobileRegex = /^[0-9]{10}$/;
      let passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

      let valid = true;

      // Name validation
      if (!nameRegex.test(name)) {
        document.getElementById("nameError").innerHTML = "Enter a valid name (only letters and spaces).";
        valid = false;
      }

      // Username validation
      if (!usernameRegex.test(username)) {
        document.getElementById("usernameError").innerHTML = "Username must contain 3-20 letters, numbers or underscore.";
        valid = false;
      }

      // Email validation
      if (!emailRegex.test(email)) {
        document.getElementById("emailError").innerHTML = "Enter a valid email address.";
        valid = false;
      }

      // Mobile validation
      if (!mobileRegex.test(mobile)) {
        document.getElementById("mobileError").innerHTML = "Mobile number must contain exactly 10 digits.";
        valid = false;
      }

      // Password validation
      if (!passwordRegex.test(password)) {
        document.getElementById("passwordError").innerHTML = "Password must be at least 8 characters and contain uppercase, lowercase and a number.";
        valid = false;
      }

      // Confirm password validation
      if (password !== confirmPassword) {
        document.getElementById("confirmPasswordError").innerHTML = "Passwords do not match.";
        valid = false;
      }

      // Gender validation
      let gender = document.querySelector('input[name="gender"]:checked');
      if (!gender) {
        document.getElementById("genderError").innerHTML = "Please select your gender.";
        valid = false;
      }

      // Display success message if all validations pass
      if (valid) {
        document.getElementById("successMessage").style.display = "block";
      }
    });
  </script>
</body>
</html>
