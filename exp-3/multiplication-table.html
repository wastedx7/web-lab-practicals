<!-- Experiment Part C: Multiplication Table Generator             -->
<!-- ============================================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplication Table</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding-top: 80px;
      margin: 0;
    }
    .box {
      background: #333;
      width: 320px;
      margin: auto;
      padding: 25px;
      border-radius: 15px;
    }
    input {
      padding: 10px;
      width: 120px;
      border-radius: 5px;
      border: none;
    }
    button {
      padding: 10px 15px;
      background: #ff9800;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #e68900;
    }
    #tableOutput {
      margin-top: 20px;
      line-height: 25px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Multiplication Table</h2>
    <input type="number" id="numberInput" placeholder="Number">
    <button onclick="generateTable()">Generate</button>
    <div id="tableOutput"></div>
  </div>

  <script>
    function generateTable() {
      let num = document.getElementById("numberInput").value;
      let output = document.getElementById("tableOutput");
      output.innerHTML = "";
      
      if (num === "") {
        output.innerHTML = "Enter a number!";
        return;
      }
      
      for (let i = 1; i <= 10; i++) {
        output.innerHTML += num + " × " + i + " = " + (num * i) + "<br>";
      }
    }
  </script>
</body>
</html>
